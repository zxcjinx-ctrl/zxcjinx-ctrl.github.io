<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Club & Roulette</title>
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --tg-theme-bg-color: #17212b;
            --tg-theme-text-color: #f5f5f5;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #708499;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Навигация (вкладки) */
        .tabs {
            display: flex;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--tg-theme-hint-color);
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }

        /* Контент вкладок */
        .content-section {
            display: none;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .content-section.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { margin-top: 0; }
        
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            color: #4dd0e1;
            margin: 15px 0;
        }

        /* Кнопки */
        .btn {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.8; }

        /* Рулетка */
        .wheel-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 20px auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #fff;
            background: conic-gradient(
                #ff4757 0deg 60deg, 
                #2ed573 60deg 120deg, 
                #1e90ff 120deg 180deg, 
                #ffa502 180deg 240deg, 
                #9b59b6 240deg 300deg,
                #34495e 300deg 360deg
            );
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ffffff;
            z-index: 10;
        }

        .wheel-labels {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-size: 12px;
            font-weight: bold;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <!-- Переключатель вкладок -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('vip')">Приватный канал</button>
        <button class="tab-btn" onclick="switchTab('roulette')">🎰 Рулетка</button>
    </div>

    <!-- Вкладка 1: Покупка доступа -->
    <div id="vip-section" class="content-section active">
        <div class="card">
            <h2>Доступ в VIP-канал</h2>
            <p>Получите пожизненный доступ к эксклюзивным материалам, аналитике и закрытому комьюнити.</p>
            <div class="price">990 ₽</div>
            <button class="btn" onclick="buyAccess()">Купить доступ</button>
        </div>
    </div>

    <!-- Вкладка 2: Рулетка -->
    <div id="roulette-section" class="content-section">
        <div class="card">
            <h2>Испытай удачу!</h2>
            <p>Выиграй скидку на подписку или секретный бонус.</p>
            
            <div class="wheel-container">
                <div class="pointer"></div>
                <div id="wheel" class="wheel"></div>
            </div>

            <button id="spin-btn" class="btn" onclick="spinWheel()">Крутить за 50 ₽</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем на весь экран

        // Применяем цвета из темы Телеграма
        document.documentElement.style.setProperty('--tg-theme-bg-color', tg.backgroundColor || '#17212b');
        document.documentElement.style.setProperty('--tg-theme-text-color', tg.textColor || '#f5f5f5');
        document.documentElement.style.setProperty('--tg-theme-button-color', tg.buttonColor || '#2481cc');
        document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.buttonTextColor || '#ffffff');

        // Переключение вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

            if (tabName === 'vip') {
                document.querySelector('[onclick="switchTab(\'vip\')"]').classList.add('active');
                document.getElementById('vip-section').classList.add('active');
            } else {
                document.querySelector('[onclick="switchTab(\'roulette\')"]').classList.add('active');
                document.getElementById('roulette-section').classList.add('active');
            }
        }

        // Логика покупки (отправка данных обратно в бота)
        function buyAccess() {
            const data = {
                action: 'buy_vip',
                item: 'Premium Access',
                price: 990
            };
            // Отправляем данные боту и закрываем приложение
            tg.sendData(JSON.stringify(data));
        }

        // Логика рулетки
        let isSpinning = false;
        const prizes = ["Скидка 10%", "Попробуй еще раз", "Скидка 50%", "VIP на 1 день", "Ничего", "Скидка 20%"];

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spin-btn');
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerText = "";
            spinBtn.disabled = true;

            // Генерируем случайное вращение (минимум 5 полных оборотов + случайный сектор)
            const randomDegree = Math.floor(Math.random() * 360) + 1800; 
            wheel.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;

                // Вычисляем, какой сектор выпал
                const actualDegree = randomDegree % 360;
                // Разворачиваем расчет против часовой стрелки, так как стрелка сверху (270 градусов относительно начала)
                const sectorIndex = Math.floor(((360 - actualDegree + 90) % 360) / 60);
                const wonPrize = prizes[sectorIndex];

                resultDiv.innerText = `🎉 Ваш выигрыш: ${wonPrize}!`;

                // Отправляем результат боту, чтобы он зафиксировал выигрыш в БД
                tg.sendData(JSON.stringify({
                    action: 'roulette_spin',
                    prize: wonPrize
                }));

            }, 4000); // 4 секунды длится анимация
        }
    </script>
</body>
</html>
